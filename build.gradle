plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"regainnbt" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// 26.x 的 Minecraft 已经是官方名（无混淆），因此不需要 mappings，也不需要 remap
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

test {
	useJUnitPlatform()
	maxHeapSize = '2G'
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}

// 把编译 classpath 导出到文件，供 tools/dev-compile.ps1 做快速 javac 检查（避免每次改代码都跑完整 Gradle）
tasks.register('dumpClasspath') {
	notCompatibleWithConfigurationCache('dumps resolved classpaths to a file')
	doLast {
		def dir = layout.buildDirectory.dir('devcp').get().asFile
		dir.mkdirs()
		new File(dir, 'main.txt').text = sourceSets.main.compileClasspath.asPath
		new File(dir, 'test.txt').text = sourceSets.test.compileClasspath.asPath + File.pathSeparator + sourceSets.test.runtimeClasspath.asPath
		println 'classpath written to ' + dir
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
